name: Server checks

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Syntax-check changed server modules
        run: |
          node --check controllers/paymentController.js
          node --check controllers/razorpayWebhookController.js
          node --check controllers/customerBookingController.js
          node --check services/paymentBookingRecoveryService.js
          node --check services/seatLockService.js
